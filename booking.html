<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Villan Studio | Booking</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/booking.css">
</head>

<body>

<header class="topbar">
  <div class="logo">VILLAN<span>STUDIO</span></div>

  <!-- HOME ICON -->
  <a href="index.html" class="home-btn">Home</a>
</header>

<section class="booking-section">
  <div class="overlay"></div>

  <div class="booking-card">
    <h2>Book Your <span>Photoshoot</span></h2>
    <p class="subtitle">Capture your moments with perfection</p>

    <form>
      <input type="text" placeholder="Full Name" required>
      <input type="email" placeholder="Email Address" required>
      <input type="tel" placeholder="Mobile Number" required>

      <select required>
        <option value="">Select Photography Type</option>
        <option>Wedding</option>
        <option>Pre-Wedding</option>
        <option>Portrait</option>
        <option>Fashion</option>
        <option>Product</option>
      </select>

      <input type="date" required>
      <textarea rows="4" placeholder="Your Message"></textarea>

      <button type="submit">Confirm Booking</button>
    </form>
  </div>
</section>

</body>
</html>
